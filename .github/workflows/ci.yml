name: Pilot CI

on:
  push:
    branches: [main, 'crewai/**']
  pull_request:

permissions:
  contents: read

jobs:
  pilot-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resuelto 2026-09-22
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, resuelto 2026-09-22
        with:
          python-version: '3.12.14'
      - name: Run the 12 pilot tests
        run: python -m unittest discover -s tests -v
